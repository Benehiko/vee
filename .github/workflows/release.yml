name: Release

# Cut a release when a v* tag is pushed. Builds the vee binary for every
# supported host (linux + macOS + windows), then publishes a GitHub Release
# whose body lists the commits since the previous tag.
#
# Windows (windows/amd64) uses the WHPX accelerator and a build-tag split that
# swaps POSIX-only paths (vsock, VFIO, setsid, unix control sockets) for Windows
# equivalents or no-ops. Linux-only features (VFIO passthrough, virtiofsd,
# swtpm, the systemd daemon) degrade gracefully there.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build vee (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-15
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="github.com/Benehiko/vee/cmd"
          LDFLAGS="-s -w \
            -X ${PKG}.version=${VERSION} \
            -X ${PKG}.commit=${COMMIT} \
            -X ${PKG}.date=${DATE}"
          BIN=vee
          if [ "${GOOS}" = "windows" ]; then BIN=vee.exe; fi
          go build -mod=vendor -trimpath -ldflags "${LDFLAGS}" -o "${BIN}" .

      # The Virtualization.framework helper (macOS guests, issue #51) needs
      # cgo (Objective-C bindings) and the com.apple.security.virtualization
      # entitlement — ad-hoc signing is sufficient, no Apple Developer
      # account. Apple Silicon only: macOS guests are arm64-only.
      - name: Build vz helper (darwin/arm64 only)
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          go build -mod=vendor -trimpath -ldflags "-s -w" -o vee-vz-helper ./cmd/vee-vz-helper
          # Guard against the !(darwin && arm64 && cgo) refusal stub sneaking
          # into a release: the real helper links Virtualization.framework.
          otool -L vee-vz-helper | grep -q Virtualization
          codesign --force --sign - --timestamp=none \
            --entitlements internal/vzhelper/vz.entitlements vee-vz-helper
          # Fail the release if the entitlement did not land.
          codesign -d --entitlements - vee-vz-helper 2>&1 | grep -q com.apple.security.virtualization

      - name: Package binary
        id: package
        run: |
          mkdir -p dist
          ASSET="vee-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          BIN=vee
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN=vee.exe; fi
          # darwin/arm64 also ships the signed Virtualization.framework helper.
          EXTRA=""
          if [ -f vee-vz-helper ]; then EXTRA="vee-vz-helper"; fi
          tar czf "dist/${ASSET}.tar.gz" "${BIN}" ${EXTRA} LICENSE README.md THIRD_PARTY_LICENSES
          ( cd dist && shasum -a 256 "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256" )

          # Also publish an unversioned copy so the install docs can use
          # stable `releases/latest/download/vee-<os>-<arch>.tar.gz` URLs.
          UNVERSIONED="vee-${{ matrix.goos }}-${{ matrix.goarch }}"
          cp "dist/${ASSET}.tar.gz" "dist/${UNVERSIONED}.tar.gz"
          ( cd dist && shasum -a 256 "${UNVERSIONED}.tar.gz" > "${UNVERSIONED}.tar.gz.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vee-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so we can diff against the previous tag for the changelog.
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          # Only consider vee version tags (v*) as the previous release. Other
          # tags — notably the vee-qemu bundle tags (qemu-*-vee*) — land between
          # vee releases and would otherwise be picked as the "previous tag",
          # producing a wrong changelog range and compare link.
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          {
            echo "## What's changed"
            echo
            if [ -n "${PREV}" ]; then
              echo "Commits since \`${PREV}\`:"
              echo
              git log --no-merges --pretty='- %s (%h)' "${PREV}..${TAG}"
              RANGE="${PREV}...${TAG}"
            else
              echo "Commits in this release:"
              echo
              git log --no-merges --pretty='- %s (%h)' "${TAG}"
              RANGE=""
            fi
            echo
            if [ -n "${RANGE}" ]; then
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${RANGE}"
            fi
            echo
            echo "---"
            echo
            echo "## Install"
            echo
            echo "Download the asset for your platform, **verify the checksum**, and put \`vee\` on your \`PATH\`. vee drives QEMU, so install your host's QEMU packages too — see the [Installation guide](https://vee.benehiko.com/getting-started/installation/)."
            echo
            REL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
            echo "### Linux"
            echo
            echo '```sh'
            echo "curl -LO ${REL}/vee-${TAG}-linux-amd64.tar.gz          # or linux-arm64"
            echo "curl -LO ${REL}/vee-${TAG}-linux-amd64.tar.gz.sha256"
            echo "sha256sum -c vee-${TAG}-linux-amd64.tar.gz.sha256"
            echo "tar xzf vee-${TAG}-linux-amd64.tar.gz"
            echo 'install -Dm755 vee "$HOME/.vee/bin/vee"'
            echo '```'
            echo
            echo "### macOS (Apple Silicon)"
            echo
            echo '```sh'
            echo "curl -LO ${REL}/vee-${TAG}-darwin-arm64.tar.gz         # Intel: darwin-amd64"
            echo "curl -LO ${REL}/vee-${TAG}-darwin-arm64.tar.gz.sha256"
            echo "shasum -a 256 -c vee-${TAG}-darwin-arm64.tar.gz.sha256"
            echo "tar xzf vee-${TAG}-darwin-arm64.tar.gz"
            echo 'mkdir -p "$HOME/.vee/bin"   # stock BSD install(1) has no GNU -D'
            echo 'install -m755 vee "$HOME/.vee/bin/vee"'
            echo 'xattr -d com.apple.quarantine "$HOME/.vee/bin/vee" 2>/dev/null || true   # unsigned binary'
            echo '# Apple Silicon only: the macOS-guest helper ships in the same tarball.'
            echo 'if [ -f vee-vz-helper ]; then'
            echo '  install -m755 vee-vz-helper "$HOME/.vee/bin/vee-vz-helper"'
            echo '  xattr -d com.apple.quarantine "$HOME/.vee/bin/vee-vz-helper" 2>/dev/null || true'
            echo 'fi'
            echo '```'
            echo
            echo "#### macOS guests: \`vee-vz-helper\`"
            echo
            echo 'The `darwin-arm64` tarball also contains **`vee-vz-helper`**, the binary that'
            echo 'hosts macOS guests on Apple'"'"'s Virtualization.framework (one helper process per'
            echo 'running guest, the way `qemu-system` backs a QEMU VM). You only need it for'
            echo '`--template macos`; every other guest runs on QEMU and ignores it.'
            echo
            echo '**Install it next to `vee`.** vee looks for the helper in this order:'
            echo
            echo '1. `$VEE_VZ_HELPER` (an explicit path, for a self-built helper)'
            echo '2. the directory containing the running `vee` binary'
            echo '3. `$HOME/.vee/bin`'
            echo '4. `$PATH`'
            echo
            echo 'So keeping both binaries in `$HOME/.vee/bin` — as the snippet above does — is'
            echo 'all that is required. **When you upgrade, replace both**: copying only `vee`'
            echo 'leaves the previous helper in place (see #61).'
            echo
            echo '**About the signature.** The helper is ad-hoc codesigned with the'
            echo '`com.apple.security.virtualization` entitlement, which macOS honours without a'
            echo 'paid Apple Developer account — it cannot create a VM otherwise. The signature'
            echo 'lives inside the binary and survives download and extraction. Downloading with'
            echo 'a browser instead of `curl` adds a quarantine flag that would make Gatekeeper'
            echo 'kill it; the `xattr -d` line above clears that, and vee also clears it and'
            echo 're-signs the helper automatically before the first guest start if needed.'
            echo
            echo 'Verify it yourself:'
            echo
            echo '```sh'
            echo 'codesign -d --entitlements - "$HOME/.vee/bin/vee-vz-helper" | grep virtualization'
            echo 'otool -L "$HOME/.vee/bin/vee-vz-helper" | grep Virtualization   # links the framework'
            echo '```'
            echo
            echo 'Building it from a source checkout instead (needs Xcode command-line tools,'
            echo 'since the framework bindings are cgo):'
            echo
            echo '```sh'
            echo 'make vz-helper      # builds, signs, and installs into $HOME/.vee/bin'
            echo '```'
            echo
            echo '**Intel Macs get no helper**, deliberately: macOS guests are Apple Silicon only.'
            echo 'If the helper is missing, vee refuses to start a macOS guest and lists every'
            echo 'location it searched — no other command is affected.'
            echo
            echo "### Windows (PowerShell)"
            echo
            echo '```powershell'
            echo "iwr ${REL}/vee-${TAG}-windows-amd64.tar.gz -OutFile vee.tar.gz"
            echo 'tar xzf vee.tar.gz'
            echo 'New-Item -ItemType Directory -Force "$HOME\.vee\bin" | Out-Null'
            echo 'Move-Item -Force vee.exe "$HOME\.vee\bin\vee.exe"'
            echo '```'
            echo
            echo 'Verify the install: `vee --help`'
            echo
            echo "## Run as a daemon (Linux)"
            echo
            echo "The daemon autostarts VMs on boot and stops them cleanly on host shutdown:"
            echo
            echo '```sh'
            echo 'vee daemon install               # writes /etc/systemd/system/vee.service, enables + starts it'
            echo 'sudo systemctl restart vee       # after upgrading the vee binary in place'
            echo 'sudo systemctl status vee        # check it'"'"'s running'
            echo '```'
            echo
            echo "After upgrading, restart the daemon so it runs the new binary. If the new binary lands at a different path, re-run \`vee daemon install\`."
          } > body.md
          cat body.md

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: body.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
